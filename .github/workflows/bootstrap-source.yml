name: Bootstrap SPINBOUND Unity source

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/bootstrap-source.yml'

permissions:
  contents: write

jobs:
  import-source:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout bootstrap repository
        uses: actions/checkout@v4

      - name: Reassemble source archive
        shell: bash
        run: |
          set -euo pipefail
          cat bootstrap/spinbound-source.part00 \
              bootstrap/spinbound-source.part01 \
              bootstrap/spinbound-source.part02 \
              bootstrap/spinbound-source.part03a \
              bootstrap/spinbound-source.part03b \
              bootstrap/spinbound-source.part03c \
              bootstrap/spinbound-source.part03d \
              bootstrap/spinbound-source.part03e \
              bootstrap/spinbound-source.part03f \
              bootstrap/spinbound-source.part04 \
              bootstrap/spinbound-source.part05 > /tmp/spinbound-source.b64
          base64 --decode /tmp/spinbound-source.b64 > /tmp/spinbound-source.tar.gz
          echo '5e02a5fca2bc3f6c98f72741d0bcd33c6cd418a80402100909e846045fafe82f  /tmp/spinbound-source.tar.gz' | sha256sum --check --strict

      - name: Expand authoritative Unity source
        shell: bash
        run: |
          set -euo pipefail
          tar -xzf /tmp/spinbound-source.tar.gz
          rm -rf bootstrap
          rm -f .github/workflows/unity-webgl.yml
          find . -maxdepth 1 -type f -name '*SPINBOUND-3.0.bat' -delete

      - name: Commit imported project
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet || git commit -m 'chore: import SPINBOUND 4.0 Unity source'
          git push origin HEAD:main
