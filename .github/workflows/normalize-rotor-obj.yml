name: Normalize Rotor OBJ groups

on:
  push:
    branches:
      - task3-orbital-explorer-hero
    paths:
      - '.github/workflows/normalize-rotor-obj.yml'

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: task3-orbital-explorer-hero
          fetch-depth: 0

      - name: Add Unity-readable OBJ groups
        shell: python
        run: |
          from pathlib import Path

          root = Path('Assets/SPINBOUND/Art/Models/Rotor')
          paths = sorted(root.glob('OrbitalExplorer_LOD*.obj'))
          if len(paths) != 3:
              raise SystemExit(f'Expected 3 Rotor LOD OBJ files, found {len(paths)}')

          for path in paths:
              lines = path.read_text(encoding='utf-8').splitlines(keepends=True)
              out = []
              inserted = 0
              for index, line in enumerate(lines):
                  out.append(line)
                  stripped = line.strip()
                  if not stripped.startswith('o '):
                      continue
                  name = stripped[2:].strip()
                  if not name:
                      raise SystemExit(f'Empty OBJ object name in {path}')
                  next_line = lines[index + 1].strip() if index + 1 < len(lines) else ''
                  expected = f'g {name}'
                  if next_line != expected:
                      out.append(expected + '\n')
                      inserted += 1
              path.write_text(''.join(out), encoding='utf-8', newline='\n')
              print(f'{path}: inserted {inserted} group declarations')

      - name: Validate normalized model source
        shell: python
        run: |
          from pathlib import Path
          import re

          for path in sorted(Path('Assets/SPINBOUND/Art/Models/Rotor').glob('OrbitalExplorer_LOD*.obj')):
              lines = path.read_text(encoding='utf-8').splitlines()
              objects = [line[2:].strip() for line in lines if line.startswith('o ')]
              groups = [line[2:].strip() for line in lines if line.startswith('g ')]
              if not objects:
                  raise SystemExit(f'No OBJ objects found: {path}')
              if objects != groups:
                  raise SystemExit(f'OBJ object/group mismatch: {path}\nobjects={objects}\ngroups={groups}')
              if path.name == 'OrbitalExplorer_LOD0.obj' and 'CounterRotationCore' not in groups:
                  raise SystemExit('LOD0 must expose CounterRotationCore as a Unity-readable OBJ group')
              print(f'{path}: {len(groups)} named groups validated')

      - name: Commit normalized authored assets
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          if git diff --quiet -- Assets/SPINBOUND/Art/Models/Rotor; then
            echo 'Rotor OBJ files already normalized.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Assets/SPINBOUND/Art/Models/Rotor/OrbitalExplorer_LOD0.obj
          git add Assets/SPINBOUND/Art/Models/Rotor/OrbitalExplorer_LOD1.obj
          git add Assets/SPINBOUND/Art/Models/Rotor/OrbitalExplorer_LOD2.obj
          git commit -m 'fix: preserve Rotor OBJ groups for Unity import'
          git push origin HEAD:task3-orbital-explorer-hero
